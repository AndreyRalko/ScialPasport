services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: social_passport
      POSTGRES_USER: social_passport
      POSTGRES_PASSWORD: social_passport
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social_passport -d social_passport"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9020:9000"
      - "9021:9001"
    volumes:
      - minio_data:/data

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DEBUG: "1"
      SECRET_KEY: django-insecure-local-docker-key
      ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
      CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: social_passport
      POSTGRES_USER: social_passport
      POSTGRES_PASSWORD: social_passport
      MINIO_ENDPOINT_URL: http://minio:9000
      MINIO_PUBLIC_URL: http://127.0.0.1:9020
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: social-passport
      DJANGO_SUPERUSER_USERNAME: admin
      DJANGO_SUPERUSER_PASSWORD: admin
      DJANGO_SUPERUSER_EMAIL: admin@local
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  postgres_data:
  minio_data:
